# Configuration for processing video files
[video]
paths = [
    "/path/to/video1.mp4",
    "/path/to/video2.mp4"
]

# AssemblyAI settings
[assemblyai]
# Leave blank to rely on the ASSEMBLYAI_API_KEY environment variable
api_key = ""
speech_model = "universal"
language = "en"
punctuate = true
format_text = true

# Audio settings
[audio]
sample_rate = 16000
channels = 1
codec = "pcm_s16le"

# Whisper CLI settings
[whisper]
# Path to the whisper model file
model_path = "ggml-large-v3-turbo.bin"
# Language code (e.g., "ru", "en", "auto")
language = "auto"
# Number of threads
threads = 16
# Suppress non-speech tokens
suppress_nst = true
# Max context
max_context = 128
# No prompt
no_prompt = true
# Best of N
best_of = 7
# Enable/disable whisper transcription
enabled = true

# Transcription method selection
[transcription]
# Method: "assemblyai" or "whisper"
method = "whisper"
